# fixed project name, so containers are scentline-* whatever the folder is called
name: scentline

services:
  backend:
    build: ./backend
    image: scentline-backend
    restart: unless-stopped   # comes back after a reboot when Docker Desktop starts
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/cache:/app/cache
      - ./backend/data:/app/data
      - ./frontend/public/demo:/demo   # build_demo.py --out /demo
    # keep the PC usable while the public server runs WindNinja (override in .env)
    cpus: "${BACKEND_CPUS:-8}"
    mem_limit: "${BACKEND_MEM:-6g}"
    environment:
      - CORS_ORIGINS=*
      - WINDNINJA_THREADS=${BACKEND_CPUS:-8}
      - MAX_RUNNING_JOBS=${MAX_RUNNING_JOBS:-1}
      # spoken team briefings (Grok Voice); put XAI_API_KEY in .env next to this file
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_TTS_VOICE=${XAI_TTS_VOICE:-}
