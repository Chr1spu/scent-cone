name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  # Builds the server image (FastAPI + WindNinja) and runs the backend tests inside it,
  # including a real WindNinja run. Layers are cached, so WindNinja only recompiles when
  # the Dockerfile changes.
  backend-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          tags: scentline-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm scentline-backend:ci python -c "from app import windninja; assert windninja.available(), 'WindNinja CLI missing'; print('WindNinja OK, wx model:', windninja.choose_wx_model())"
      - run: docker run --rm scentline-backend:ci pytest -q
