# Fly.io: `fly launch --copy-config --no-deploy` then `fly deploy` from backend/.
app = "scent-cone-api"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "2gb"
  cpus = 2
