# Render blueprint: backend as a Docker web service (WindNinja inside), frontend as a static site.
services:
  - type: web
    name: scentline-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: standard
    envVars:
      - key: CORS_ORIGINS
        value: "*"
  - type: web
    name: scentline
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: scentline-api
          envVarKey: RENDER_EXTERNAL_URL
